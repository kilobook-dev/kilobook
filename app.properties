# 앱 이름 설정 (UTF-8). 이름이 들어가는 빌드 값은 모두 여기서 온다.

# 화면 제목, 런처, 서비스 알림에 보이는 이름
appName=킬로북

# 영문 표기. 제출 APK 파일명과 서명 인증서의 O(조직 이름)에 쓴다
appNameEn=KiloBook

# 영문 소문자. 패키지 이름(com.<appSlug>.<appIdSuffix>), 서명 인증서 CN(<appSlug>-dev), 키 파일 이름에 쓴다
appSlug=kilobook

# 패키지 이름의 마지막 부분
appIdSuffix=app

# 팀명. 개인 참가라 앱 영문 이름을 쓴다 (운영사무국 답변). 제출 APK 파일명: apk/<teamName>_<appNameEn>_release.apk
teamName=KiloBook
