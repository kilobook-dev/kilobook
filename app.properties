# 앱 이름 설정 (UTF-8). 이름이 들어가는 빌드 값은 모두 여기서 온다.
# 가칭이다. 같은 이름의 Google Play 앱이 있어 확정 전에 바꾼다 (CLAUDE.md "앱 이름").

# 화면 제목, 런처, 서비스 알림에 보이는 이름
appName=오도로그 스파이크

# 영문 소문자. 패키지 이름(com.<appSlug>.<appIdSuffix>), 제출 APK 파일명, 서명 인증서 이름(CN/O)에 쓴다
appSlug=odolog

# 패키지 이름의 마지막 부분 (기술 검증 단계라 spike)
appIdSuffix=spike

# 팀명 (미정). 제출 APK 파일명: apk/<teamName>_<AppSlug>_release.apk
teamName=TEAMNAME
